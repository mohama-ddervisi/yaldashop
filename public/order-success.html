<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پرداخت موفق | یلداشاپ</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family:'Vazirmatn', sans-serif;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        overflow:hidden;
        position:relative;
    }
    .confetti {
        position:fixed; top:-10px; width:10px; height:10px;
        border-radius:2px; opacity:0.9; animation: fall linear infinite;
    }
    @keyframes fall {
        to { transform: translateY(110vh) rotate(360deg); opacity:0.3; }
    }
    .card {
        background: rgba(255,255,255,0.06);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 28px;
        padding: 50px 40px;
        max-width: 440px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        z-index: 2;
        animation: popIn 0.6s cubic-bezier(.17,.89,.32,1.28);
    }
    @keyframes popIn {
        from { opacity:0; transform: scale(0.7) translateY(30px); }
        to { opacity:1; transform: scale(1) translateY(0); }
    }
    .check-wrap {
        width: 110px; height: 110px; margin: 0 auto 25px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00c853, #64dd17);
        display:flex; align-items:center; justify-content:center;
        box-shadow: 0 0 0 8px rgba(0,200,83,0.15), 0 10px 30px rgba(0,200,83,0.4);
        animation: bounceIn 0.7s 0.2s both;
    }
    @keyframes bounceIn {
        0% { transform: scale(0); }
        60% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }
    .check-wrap svg { width:55px; height:55px; }
    .check-wrap path {
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: draw 0.5s 0.6s forwards ease-out;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    h1 {
        color:#fff; font-size:26px; font-weight:900; margin-bottom:10px;
    }
    p.sub { color:#c7c7d9; font-size:15px; line-height:1.8; margin-bottom:25px; }
    .order-box {
        background: rgba(255,255,255,0.08);
        border: 1px dashed rgba(255,255,255,0.25);
        border-radius: 14px;
        padding: 14px 20px;
        margin-bottom: 30px;
        color: #a8e6a1;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.5px;
    }
    .btns { display:flex; flex-direction:column; gap:12px; }
    a.btn {
        display:block;
        padding: 15px;
        border-radius: 14px;
        text-decoration:none;
        font-weight: 700;
        font-size: 15px;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    a.btn.primary {
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        color:#fff;
        box-shadow: 0 8px 25px rgba(124,58,237,0.5);
    }
    a.btn.primary:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(124,58,237,0.6); }
    a.btn.secondary {
        background: rgba(255,255,255,0.08);
        color:#dcdcec;
        border: 1px solid rgba(255,255,255,0.2);
    }
    a.btn.secondary:hover { background: rgba(255,255,255,0.14); }
</style>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
</head>
<body>

<div class="card">
    <div class="check-wrap">
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    <h1>پرداخت با موفقیت انجام شد 🎉</h1>
    <p class="sub">سفارش شما ثبت شد و به‌زودی برای ارسال آماده می‌شود.<br>از خرید شما سپاسگزاریم.</p>
    <div class="order-box" id="orderBox">شماره سفارش: —</div>
    <div class="btns">
        <a href="/products.html" class="btn primary">ادامه خرید</a>
        <a href="/orders.html" class="btn secondary">پیگیری سفارش‌ها</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("orderId");
    if (orderId) {
        document.getElementById("orderBox").textContent = "شماره سفارش: #" + orderId;
    }

    const colors = ["#7c3aed","#a855f7","#00c853","#ffd700","#00bcd4"];
    for (let i = 0; i < 60; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration = (Math.random() * 3 + 2) + "s";
        c.style.animationDelay = (Math.random() * 2) + "s";
        document.body.appendChild(c);
    }
</script>

</body>
</html>
