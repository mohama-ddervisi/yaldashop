<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>حساب کاربری</title>

    <link
        rel="stylesheet"
        href="/css/style.css">

    <link
        rel="stylesheet"
        href="/css/profile.css">

</head>

<body>

<header class="profile-header">

    <a href="/" class="back-btn">

        ←

    </a>

    <h2>

        حساب کاربری

    </h2>

</header>

<main class="profile-page">

    <div class="profile-card">

        <div class="profile-avatar">

            <img
                src="/images/circle-user-regular-full.svg"
                alt="profile">

        </div>

        <h2 id="profile-name">

            ...

        </h2>

        <p id="profile-phone">

            ...

        </p>

        <p id="profile-email">

            ...

        </p>

    </div>

   <div class="profile-menu">

        <a href="#" class="profile-menu-item">
            <span class="profile-menu-icon">
                <img src="/images/circle-user-regular-full.svg" alt="">
            </span>
            <span class="profile-menu-text">ویرایش اطلاعات</span>
            <span class="profile-menu-arrow">›</span>
        </a>

        <a href="#" class="profile-menu-item">
            <span class="profile-menu-icon">
                <img src="/images/lock-closed-svgrepo-com.svg" alt="">
            </span>
            <span class="profile-menu-text">تغییر رمز عبور</span>
            <span class="profile-menu-arrow">›</span>
        </a>

        <a href="/orders.html" class="profile-menu-item">
            <span class="profile-menu-icon">
                <img src="/images/truck-svgrepo-com.svg" alt="">
            </span>
            <span class="profile-menu-text">سفارش‌های من</span>
            <span class="profile-menu-arrow">›</span>
        </a>

        <a href="#" class="profile-menu-item">
            <span class="profile-menu-icon">
                <img src="/images/home-page-svgrepo-com.svg" alt="">
            </span>
            <span class="profile-menu-text">آدرس‌های من</span>
            <span class="profile-menu-arrow">›</span>
        </a>

        <a href="/wishlist.html" class="profile-menu-item">
            <span class="profile-menu-icon">
                <img src="/images/heart-regular-full.svg" alt="">
            </span>
            <span class="profile-menu-text">علاقه‌مندی‌های من</span>
            <span class="profile-menu-arrow">›</span>
        </a>

        <button id="logout-profile-btn" class="profile-menu-item profile-logout">
            <span class="profile-menu-icon">
                <img src="/images/lock-closed-svgrepo-com.svg" alt="">
            </span>
            <span class="profile-menu-text">خروج از حساب</span>
        </button>

    </div>

</main>

<div id="toast">

    <span id="toast-message"></span>

</div>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
