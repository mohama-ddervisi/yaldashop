<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه محصولات | یلدا شاپ</title>
   <link rel="stylesheet" href="/css/style.css">
   


<link rel="stylesheet" href="/css/header.css">

<link rel="stylesheet" href="/css/footer.css">

<link rel="stylesheet" href="/css/products.css">

<link rel="stylesheet" href="/css/product-page.css">

<link rel="stylesheet" href="/css/responsive.css">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
</head>
<body>
  <header class="header">

    <div class="nav">

        <!-- Left Icons -->
        <div class="nav-left">

            <div class="profile-box">
               <a href="/login.html" id="header-profile-link" class="icon">
                    <img
                        id="profile-icon"
                        src="/images/circle-user-regular-full.svg"
                        class="icon-image">
                </a>
            </div>

            <a href="/wishlist.html" class="icon">
                <img
                    src="/images/heart-regular-full.svg"
                    class="icon-image">

                <span id="wishlist-count">0</span>
            </a>

            <a href="/cart.html" class="icon cart">
                <img
                    src="/images/shopping-cart-1135-svgrepo-com.svg"
                    alt="Cart"
                    class="icon-image">

                <span id="cart-count">0</span>
            </a>

        </div>
        <!-- End nav-left -->

        <!-- Logo -->
        <div class="logo">
            <h1>YALDA</h1>
            <span>SHOP</span>
        </div>

       <!-- Mobile Bell -->
        <a href="#" class="mobile-bell icon">
            <img
                src="/images/bell-svgrepo-com.svg"
                class="icon-image">
        </a>

        <!-- Desktop Right Side: Search + Menu -->
        <div class="nav-right">

            <div class="nav-search search-box">
                <input type="text" id="nav-search-input" class="search-input" placeholder="جستجوی محصولات...">
                <div class="search-results"></div>
            </div>

            <nav class="menu">
                <a href="/products.html?category=all">فروشگاه</a>
               
                <a href="/about.html">درباره ما</a>
                <a href="/contact.html">تماس</a>
            </nav>

        </div>

        <!-- Mobile Hamburger -->
        <div class="hamburgers">

            <label class="hamburger">

                <input
                    id="menu-toggle"
                    type="checkbox">

                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>

            </label>

        </div>

    </div>

</header>

    
<section class="products-page">

    <div class="products-breadcrumb">

        <a href="/">خانه</a>

        <span>/</span>

        <span id="category-title">
            همه محصولات
        </span>

    </div>

    <div class="products-header">

        <div class="products-title">

            <h1 id="page-title">
                همه محصولات
            </h1>

            <p id="products-count">
                0 محصول
            </p>

        </div>

        <div class="products-sort">

            <select id="sort-select">

                <option value="default">
                    جدیدترین
                </option>

                <option value="cheap">
                    ارزان‌ترین
                </option>

                <option value="expensive">
                    گران‌ترین
                </option>

                <option value="discount">
                    بیشترین تخفیف
                </option>

            </select>

        </div>

    </div>

            </aside>

        <div class="products-content">

            <div id="products-container"
                 class="products-grid">

            </div>

        </div>

    </div>

</section>

<script src="/js/cart-utils.js"></script>

<script src="/js/wishlist-utils.js"></script>

<script src="/js/common.js"></script>

<script src="/js/products.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/main.js"></script>
</body>
</html>
